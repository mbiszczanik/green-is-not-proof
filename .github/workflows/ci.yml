name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install modules
        run: |
          Install-Module Pester -MinimumVersion 5.5 -MaximumVersion 5.99 -Force -Scope CurrentUser
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
      - name: Pester
        run: |
          $r = Invoke-Pester -Path ./tests -PassThru
          if ($null -eq $r -or $r.FailedCount -gt 0 -or $r.TotalCount -eq 0) {
            $Host.SetShouldExit(1); exit 1
          }
      - name: PSScriptAnalyzer
        run: |
          $f = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 |
            Where-Object { $_.Severity -in 'Warning', 'Error' }
          if ($f) {
            $f | Format-Table -AutoSize | Out-String | Write-Host
            $Host.SetShouldExit(1); exit 1
          }
      - name: Bicep lint
        run: |
          # Linter warnings exit 0, so the gate reads the diagnostics, not the exit code.
          $out = az bicep lint --file infra/declared.bicep 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0 -or $out -cmatch ': (Warning|Error) ') { $Host.SetShouldExit(1); exit 1 }
      - name: Public content
        run: |
          ./tools/Test-PublicContent.ps1 -Path (git ls-files)
          if ($LASTEXITCODE -ne 0) { $Host.SetShouldExit(1); exit 1 }
      - name: Public content in pull request commits
        if: github.event_name == 'pull_request'
        run: |
          ./tools/Test-PublicContent.ps1 -CommitRange "origin/${{ github.base_ref }}..HEAD"
          if ($LASTEXITCODE -ne 0) { $Host.SetShouldExit(1); exit 1 }
